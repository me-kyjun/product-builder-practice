<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animal Face Test</title>
  <meta name="google-adsense-account" content="ca-pub-9457106648027800">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9457106648027800"
     crossorigin="anonymous"></script>
  <link href='style.css' rel='stylesheet'>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
</head>
<body>
  <div class="lotto-container">
    <a href="index.html" style="text-decoration: none; color: var(--text-color); font-size: 0.9em; display: block; margin-bottom: 20px;">← 뒤로 가기</a>
    <h1>동물상 테스트</h1>
    
    <div id="file-section" class="test-section">
      <div class="upload-container" id="upload-area" onclick="document.getElementById('image-upload').click()">
        <div class="upload-icon">📸</div>
        <p>클릭하거나 사진을 이곳에 끌어다 놓으세요</p>
        <input type="file" id="image-upload" accept="image/*" onchange="handleFileUpload(event)" style="display: none;">
      </div>
      
      <div id="image-preview-container">
        <img id="image-preview" src="#" alt="미리보기" style="display: none; width: 250px; height: 250px; object-fit: cover; margin: 20px auto; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
      </div>
    </div>

    <div id="label-container"></div>
  </div>

  <style>
    .test-section {
      min-height: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
    }
    
    .upload-container {
      width: 100%;
      max-width: 400px;
      padding: 40px 20px;
      border: 2px dashed #ccc;
      border-radius: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: rgba(0,0,0,0.02);
    }
    
    .upload-container:hover {
      border-color: var(--button-background-color);
      background: rgba(92, 184, 92, 0.05);
    }
    
    .dark-mode .upload-container {
      background: rgba(255,255,255,0.05);
      border-color: #555;
    }
    
    .dark-mode .upload-container:hover {
      border-color: var(--button-background-color);
      background: rgba(76, 175, 80, 0.1);
    }
    
    .upload-icon {
      font-size: 3em;
      margin-bottom: 10px;
    }
    
    .upload-container p {
      margin: 0;
      color: var(--text-color);
      font-size: 1.1em;
    }

    #label-container {
      margin-top: 30px;
      font-size: 1.2em;
      color: var(--text-color);
      text-align: center;
      width: 100%;
      max-width: 400px;
    }
    
    #label-container div {
      margin-bottom: 10px;
      padding: 12px;
      background: rgba(0,0,0,0.05);
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s;
    }
    
    #label-container div:first-child {
      background: var(--button-background-color);
      color: white;
      font-weight: bold;
      transform: scale(1.05);
    }

    .dark-mode #label-container div {
      background: rgba(255,255,255,0.1);
    }
  </style>

  <script type="text/javascript">
    const ANIMAL_URL = "https://teachablemachine.withgoogle.com/models/NESzUcrac/";
    let model, labelContainer, maxPredictions;

    async function loadModel() {
      if (!model) {
        const modelURL = ANIMAL_URL + "model.json";
        const metadataURL = ANIMAL_URL + "metadata.json";
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();
      }
    }

    // Drag and drop handling
    const uploadArea = document.getElementById('upload-area');
    
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      uploadArea.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults (e) {
      e.preventDefault();
      e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
      uploadArea.addEventListener(eventName, () => {
        uploadArea.style.borderColor = 'var(--button-background-color)';
        uploadArea.style.background = 'rgba(92, 184, 92, 0.1)';
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      uploadArea.addEventListener(eventName, () => {
        uploadArea.style.borderColor = '#ccc';
        uploadArea.style.background = 'rgba(0,0,0,0.02)';
      }, false);
    });

    uploadArea.addEventListener('drop', handleDrop, false);

    function handleDrop(e) {
      const dt = e.dataTransfer;
      const files = dt.files;
      handleFileUpload({ target: { files: files } });
    }

    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        const img = document.getElementById('image-preview');
        img.src = e.target.result;
        img.style.display = 'block';
        
        await loadModel();
        
        // Ensure results container is ready
        labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = '분석 중...';
        
        // Wait for image to load to predict
        img.onload = async function() {
          await predict(img);
        };
      };
      reader.readAsDataURL(file);
    }

    async function predict(imageElement) {
      const prediction = await model.predict(imageElement);
      prediction.sort((a, b) => b.probability - a.probability);
      
      labelContainer = document.getElementById("label-container");
      labelContainer.innerHTML = '';

      for (let i = 0; i < maxPredictions; i++) {
        const div = document.createElement("div");
        const className = document.createElement("span");
        className.textContent = prediction[i].className;
        
        const probability = document.createElement("span");
        probability.textContent = (prediction[i].probability * 100).toFixed(0) + "%";
        
        div.appendChild(className);
        div.appendChild(probability);
        labelContainer.appendChild(div);
      }
    }
    
    // Check for dark mode
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
    }
  </script>
</body>
</html>
