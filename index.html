<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lotto Number Generator</title>
  <link href='style.css' rel='stylesheet'>
</head>
<body>
  <div class="lotto-container">
    <h1>Lotto Number Generator</h1>
    <div class="theme-switch-wrapper">
      <label class="theme-switch" for="checkbox">
        <input type="checkbox" id="checkbox" />
        <div class="slider round">
          <span class="emoji sun">☀️</span>
          <span class="emoji moon">🌙</span>
        </div>
      </label>
    </div>
    <button onclick="generateLottoNumbers()">Generate Numbers</button>
    <div id="lotto-numbers"></div>
    
    <hr class="form-divider">
    
    <div class="contact-form-container">
      <h3>제휴 문의</h3>
      <form action="https://formspree.io/f/xpqjqvjk" method="POST">
        <div class="form-group">
          <input type="email" name="email" placeholder="이메일 주소" required>
        </div>
        <div class="form-group">
          <textarea name="message" placeholder="문의 내용" required></textarea>
        </div>
        <button type="submit" class="submit-btn">보내기</button>
      </form>
    </div>
  </div>
  <script defer type="text/javascript" src="main.js"></script>
</body>
</html>
